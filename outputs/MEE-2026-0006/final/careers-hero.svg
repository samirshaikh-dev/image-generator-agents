<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" width="1440" height="1080" fill="none">
  <defs>
    <!-- Background & Ambient Radial Glow -->
    <radialGradient id="careersGlow" cx="50%" cy="50%" r="48%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#743BAA" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#FEA711" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F4EFFD" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Purple Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8445C2" />
      <stop offset="100%" stop-color="#743BAA" />
    </linearGradient>

    <linearGradient id="purpleDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#743BAA" />
      <stop offset="100%" stop-color="#552483" />
    </linearGradient>

    <!-- Warm Orange Accent Gradients -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB534" />
      <stop offset="100%" stop-color="#FEA711" />
    </linearGradient>

    <linearGradient id="orangeHotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEA711" />
      <stop offset="100%" stop-color="#E58E00" />
    </linearGradient>

    <!-- Card & Screen Surfaces -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF7FD" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadowLarge" x="-20%" y="-20%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#743BAA" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#171923" flood-opacity="0.06" />
    </filter>

    <filter id="shadowMedium" x="-25%" y="-25%" width="150%" height="155%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#743BAA" flood-opacity="0.13" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#171923" flood-opacity="0.05" />
    </filter>

    <filter id="shadowOrange" x="-25%" y="-25%" width="150%" height="155%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FEA711" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- 1. Canvas Background (Seamless Meelte Lavender) -->
  <rect width="1440" height="1080" fill="#F4EFFD" />

  <!-- 2. Ambient Radial Glow Behind Central Cluster -->
  <circle cx="720" cy="530" r="480" fill="url(#careersGlow)" />

  <!-- 3. Stylized Neighbourhood Map Backdrop -->
  <g id="neighbourhood-map" opacity="0.45">
    <!-- Map Canvas Plate -->
    <rect x="220" y="240" width="1000" height="540" rx="36" fill="#FFFFFF" opacity="0.6" stroke="#743BAA" stroke-width="2" stroke-dasharray="6 6" />
    
    <!-- Curved Street Grid Paths -->
    <path d="M 260 480 Q 450 360, 680 430 T 1180 390" stroke="#743BAA" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.25" />
    <path d="M 380 260 Q 520 490, 620 720" stroke="#743BAA" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.2" />
    <path d="M 800 260 Q 780 480, 960 740" stroke="#743BAA" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.2" />
    <path d="M 340 640 Q 640 570, 1080 620" stroke="#FEA711" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.3" stroke-dasharray="10 10" />

    <!-- Miniature Local Shopfront Silhouette 1 (Left Cafe) -->
    <g transform="translate(330, 360)">
      <rect x="0" y="25" width="70" height="55" rx="6" fill="#743BAA" opacity="0.4" />
      <!-- Striped Awning -->
      <path d="M -6 25 L 76 25 L 70 8 L 0 8 Z" fill="#FEA711" opacity="0.8" />
      <rect x="18" y="44" width="34" height="36" rx="4" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Miniature Local Shopfront Silhouette 2 (Right Bookstore/Boutique) -->
    <g transform="translate(1020, 440)">
      <rect x="0" y="25" width="75" height="60" rx="6" fill="#743BAA" opacity="0.4" />
      <!-- Striped Awning -->
      <path d="M -6 25 L 81 25 L 75 8 L 0 8 Z" fill="#743BAA" opacity="0.7" />
      <circle cx="37" cy="52" r="14" fill="#FEA711" opacity="0.8" />
    </g>

    <!-- Floating Map Discovery Pin (North-West) -->
    <g transform="translate(480, 290) scale(0.8)">
      <path d="M 20 0 C 8.95 0 0 8.95 0 20 C 0 35 20 54 20 54 C 20 54 40 35 40 20 C 40 8.95 31.05 0 20 0 Z" fill="#743BAA" />
      <circle cx="20" cy="18" r="8" fill="#FEA711" />
    </g>

    <!-- Floating Map Discovery Pin (South-East) -->
    <g transform="translate(940, 560) scale(0.85)">
      <path d="M 20 0 C 8.95 0 0 8.95 0 20 C 0 35 20 54 20 54 C 20 54 40 35 40 20 C 40 8.95 31.05 0 20 0 Z" fill="#FEA711" />
      <circle cx="20" cy="18" r="8" fill="#FFFFFF" />
    </g>
  </g>

  <!-- 4. Collaboration Desk Surface -->
  <g id="desk-surface">
    <!-- Clean Rounded Desk Top Plane -->
    <rect x="240" y="730" width="960" height="28" rx="14" fill="#171923" opacity="0.1" />
    <path d="M 280 734 L 1160 734" stroke="#743BAA" stroke-width="4" stroke-linecap="round" opacity="0.25" />
  </g>

  <!-- 5. Core Midground Anchor: Open Laptop & Collaboration Devices -->
  <g id="devices-anchor" transform="translate(490, 430)">
    <!-- Laptop Base & Keyboard Base (Shadowed) -->
    <g filter="url(#shadowLarge)">
      <!-- Open Display Screen Backing -->
      <rect x="50" y="30" width="360" height="235" rx="16" fill="url(#purpleDarkGrad)" stroke="#743BAA" stroke-width="3" />
      
      <!-- Display Screen Face -->
      <rect x="64" y="44" width="332" height="206" rx="10" fill="#FFFFFF" />

      <!-- Screen UI: Collaborative Product Interface -->
      <!-- Top App Bar -->
      <rect x="64" y="44" width="332" height="32" rx="10" fill="#F4EFFD" />
      <circle cx="82" cy="60" r="5" fill="#FEA711" />
      <circle cx="98" cy="60" r="5" fill="#743BAA" opacity="0.5" />
      <circle cx="114" cy="60" r="5" fill="#743BAA" opacity="0.2" />

      <!-- Screen Content: Analytics & Map Overview Blocks -->
      <rect x="80" y="90" width="130" height="68" rx="8" fill="#F4EFFD" />
      <rect x="92" y="104" width="45" height="10" rx="5" fill="#743BAA" />
      <rect x="92" y="122" width="90" height="8" rx="4" fill="#FEA711" opacity="0.8" />
      <rect x="92" y="136" width="60" height="6" rx="3" fill="#171923" opacity="0.25" />

      <rect x="224" y="90" width="156" height="68" rx="8" fill="url(#purpleGrad)" opacity="0.12" />
      <!-- Mini Chart Bars on Screen -->
      <rect x="244" y="130" width="14" height="20" rx="3" fill="#743BAA" />
      <rect x="268" y="118" width="14" height="32" rx="3" fill="#FEA711" />
      <rect x="292" y="124" width="14" height="26" rx="3" fill="#743BAA" />
      <rect x="316" y="110" width="14" height="40" rx="3" fill="#FEA711" />
      <rect x="340" y="116" width="14" height="34" rx="3" fill="#743BAA" />

      <!-- Team Collaboration Avatars on Screen Corner -->
      <circle cx="340" cy="188" r="14" fill="#FEA711" />
      <circle cx="316" cy="188" r="14" fill="#743BAA" />
      <circle cx="292" cy="188" r="14" fill="#552483" />
      <rect x="80" y="172" width="180" height="32" rx="8" fill="#F4EFFD" />
      <rect x="94" y="184" width="90" height="8" rx="4" fill="#743BAA" opacity="0.7" />

      <!-- Laptop Bottom Base / Keyboard Deck -->
      <path d="M 10 262 L 450 262 C 456 262 460 266 458 272 L 442 300 C 438 306 430 310 422 310 L 38 310 C 30 310 22 306 18 300 L 2 272 C 0 266 4 262 10 262 Z" fill="#743BAA" />
      <!-- Trackpad -->
      <rect x="180" y="278" width="100" height="24" rx="6" fill="#F4EFFD" opacity="0.8" />
    </g>

    <!-- Companion Mobile Device (Smartphone on Desk Beside Laptop) -->
    <g transform="translate(420, 140)" filter="url(#shadowMedium)">
      <rect x="0" y="0" width="80" height="150" rx="16" fill="url(#purpleDarkGrad)" stroke="#FFFFFF" stroke-width="2" />
      <rect x="5" y="8" width="70" height="134" rx="12" fill="#FFFFFF" />
      <!-- Phone Screen Header Pill -->
      <rect x="24" y="14" width="32" height="5" rx="2.5" fill="#171923" opacity="0.2" />
      <!-- App Notification Dot & Badge -->
      <circle cx="40" cy="50" r="18" fill="url(#orangeGrad)" />
      <path d="M 34 50 L 38 54 L 47 45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="16" y="80" width="48" height="8" rx="4" fill="#743BAA" />
      <rect x="22" y="96" width="36" height="6" rx="3" fill="#FEA711" opacity="0.7" />
      <rect x="18" y="110" width="44" height="6" rx="3" fill="#F4EFFD" />
    </g>

    <!-- Warm Coffee Cup on Desk -->
    <g transform="translate(-80, 230)">
      <!-- Saucer -->
      <ellipse cx="40" cy="65" rx="36" ry="9" fill="#171923" opacity="0.12" />
      <ellipse cx="40" cy="63" rx="32" ry="7" fill="#F4EFFD" stroke="#743BAA" stroke-width="2" />
      <!-- Cup Body -->
      <path d="M 18 25 L 24 55 Q 40 60, 56 55 L 62 25 Z" fill="url(#purpleGrad)" />
      <!-- Cup Handle -->
      <path d="M 60 30 Q 76 30, 72 45 Q 68 53, 57 51" stroke="#743BAA" stroke-width="5" fill="none" stroke-linecap="round" />
      <!-- Coffee Surface -->
      <ellipse cx="40" cy="25" rx="22" ry="7" fill="#FEA711" opacity="0.9" />
      <!-- Steam Wisps -->
      <path d="M 33 16 Q 30 8, 36 2" stroke="#FEA711" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
      <path d="M 44 14 Q 48 6, 42 0" stroke="#743BAA" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>
  </g>

  <!-- 6. Floating Rounded Milestone Cards (Foreground Plane) -->

  <!-- Milestone Card 1: Launching Rocket (Top Right - Mission & High Growth) -->
  <g transform="translate(980, 210)" filter="url(#shadowOrange)">
    <!-- Card Backing -->
    <rect x="0" y="0" width="168" height="168" rx="28" fill="url(#cardSurface)" stroke="#FEA711" stroke-width="3" />
    
    <!-- Rocket Icon Group -->
    <g transform="translate(84, 84)">
      <!-- Rocket Fire Exhaust Trail -->
      <path d="M -12 28 Q 0 54, 12 28 Q 6 36, 0 46 Q -6 36, -12 28 Z" fill="url(#orangeGrad)" />
      <path d="M -6 28 Q 0 42, 6 28 Z" fill="#FFE180" />

      <!-- Left & Right Fins -->
      <path d="M -18 10 Q -32 20, -22 30 L -12 24 Z" fill="#743BAA" />
      <path d="M 18 10 Q 32 20, 22 30 L 12 24 Z" fill="#743BAA" />

      <!-- Rocket Fuselage Body -->
      <path d="M 0 -44 C 18 -26, 20 8, 16 26 L -16 26 C -20 8, -18 -26, 0 -44 Z" fill="url(#orangeGrad)" />
      
      <!-- Rocket Nose Cone Highlight -->
      <path d="M 0 -44 C 9 -35, 12 -26, 12 -16 L -12 -16 C -12 -26, -9 -35, 0 -44 Z" fill="#FFB534" />

      <!-- Center Porthole Window -->
      <circle cx="0" cy="-2" r="11" fill="#FFFFFF" stroke="#743BAA" stroke-width="3" />
      <circle cx="0" cy="-2" r="6" fill="#743BAA" />
    </g>

    <!-- Top Badge Dot -->
    <circle cx="146" cy="22" r="7" fill="#FEA711" />
  </g>

  <!-- Milestone Card 2: Innovation Lightbulb (Top Left - Big Ideas & Problem Solving) -->
  <g transform="translate(290, 220)" filter="url(#shadowMedium)">
    <!-- Card Backing -->
    <rect x="0" y="0" width="160" height="160" rx="28" fill="url(#cardSurface)" stroke="#743BAA" stroke-width="2.5" />
    
    <!-- Lightbulb Icon Group -->
    <g transform="translate(80, 75)">
      <!-- Ambient Bulb Glow Rays -->
      <path d="M 0 -46 L 0 -54" stroke="#FEA711" stroke-width="4" stroke-linecap="round" />
      <path d="M -34 -32 L -40 -38" stroke="#FEA711" stroke-width="4" stroke-linecap="round" />
      <path d="M 34 -32 L 40 -38" stroke="#FEA711" stroke-width="4" stroke-linecap="round" />
      <path d="M -46 0 L -54 0" stroke="#FEA711" stroke-width="4" stroke-linecap="round" />
      <path d="M 46 0 L 54 0" stroke="#FEA711" stroke-width="4" stroke-linecap="round" />

      <!-- Glass Bulb Sphere -->
      <path d="M -24 -6 C -32 -18, -26 -38, 0 -38 C 26 -38, 32 -18, 24 -6 C 18 4, 14 12, 14 20 L -14 20 C -14 12, -18 4, -24 -6 Z" fill="url(#orangeGrad)" />
      
      <!-- Filament Accent -->
      <path d="M -7 -4 Q 0 -18, 7 -4" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" />

      <!-- Screw Base -->
      <rect x="-11" y="22" width="22" height="6" rx="2" fill="#743BAA" />
      <rect x="-9" y="30" width="18" height="6" rx="2" fill="#743BAA" />
      <!-- Base Contact Point -->
      <path d="M -6 38 C -6 42, 6 42, 6 38 Z" fill="#552483" />
    </g>

    <!-- Purple Corner Badge -->
    <circle cx="136" cy="24" r="6" fill="#743BAA" />
  </g>

  <!-- Milestone Card 3: Code & Engineering (Bottom Left - Technical Craft) -->
  <g transform="translate(230, 480)" filter="url(#shadowMedium)">
    <!-- Card Backing -->
    <rect x="0" y="0" width="170" height="150" rx="28" fill="url(#cardSurface)" stroke="#743BAA" stroke-width="2.5" />
    
    <!-- Code Brackets Icon Group -->
    <g transform="translate(85, 75)">
      <!-- Left Bracket < -->
      <path d="M -20 -24 L -42 0 L -20 24" stroke="#743BAA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Slash / -->
      <path d="M 4 -28 L -4 28" stroke="#FEA711" stroke-width="6" stroke-linecap="round" fill="none" />
      <!-- Right Bracket > -->
      <path d="M 20 -24 L 42 0 L 20 24" stroke="#743BAA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Code Line Accent Dots -->
    <circle cx="42" cy="120" r="5" fill="#FEA711" />
    <rect x="56" y="117" width="48" height="6" rx="3" fill="#743BAA" opacity="0.4" />
  </g>

  <!-- Milestone Card 4: Verified Checkmark & Quality (Middle Right - Impact & Trust) -->
  <g transform="translate(1030, 450)" filter="url(#shadowLarge)">
    <!-- Card Backing -->
    <rect x="0" y="0" width="160" height="150" rx="28" fill="url(#cardSurface)" stroke="#743BAA" stroke-width="2.5" />
    
    <!-- Checkmark Circle Plate -->
    <g transform="translate(80, 75)">
      <circle cx="0" cy="0" r="42" fill="url(#purpleGrad)" />
      <!-- Thick Clean White Checkmark -->
      <path d="M -18 2 L -5 15 L 20 -10" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Warm Orange Corner Accent Pill -->
    <rect x="108" y="18" width="34" height="10" rx="5" fill="#FEA711" />
  </g>

  <!-- Milestone Card 5: Community Chat Bubble (Bottom Right - Friendly Culture) -->
  <g transform="translate(930, 680)" filter="url(#shadowMedium)">
    <!-- Speech Bubble Shape -->
    <path d="M 24 0 L 140 0 C 153.25 0 164 10.75 164 24 L 164 80 C 164 93.25 153.25 104 140 104 L 60 104 L 30 128 L 36 104 L 24 104 C 10.75 104 0 93.25 0 80 L 0 24 C 0 10.75 10.75 0 24 0 Z" fill="url(#orangeGrad)" />
    <!-- Three Friendly Chat Dots inside Bubble -->
    <circle cx="52" cy="52" r="9" fill="#FFFFFF" />
    <circle cx="82" cy="52" r="9" fill="#FFFFFF" />
    <circle cx="112" cy="52" r="9" fill="#FFFFFF" />
  </g>

  <!-- 7. Delicate Curved Connecting Lines Between Milestone Nodes -->
  <g id="connecting-paths" stroke="#743BAA" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round" fill="none" opacity="0.32">
    <!-- From Lightbulb Card to Laptop Top -->
    <path d="M 450 310 Q 510 320, 560 410" />
    <!-- From Rocket Card to Laptop Top -->
    <path d="M 980 320 Q 900 340, 840 410" />
    <!-- From Code Card to Desk & Phone -->
    <path d="M 400 540 Q 460 570, 500 600" />
    <!-- From Checkmark Card to Laptop Edge -->
    <path d="M 1030 540 Q 970 540, 930 550" />
  </g>

  <!-- 8. Floating Ambient Sparkles & Energy Stars (Meelte Brand Spark) -->
  <g id="floating-sparkles">
    <!-- Large Orange 4-Point Star (Top Left) -->
    <path d="M 210 180 Q 210 196, 194 196 Q 210 196, 210 212 Q 210 196, 226 196 Q 210 196, 210 180 Z" fill="#FEA711" />
    
    <!-- Medium Purple Star (Top Right) -->
    <path d="M 1190 160 Q 1190 174, 1176 174 Q 1190 174, 1190 188 Q 1190 174, 1204 174 Q 1190 174, 1190 160 Z" fill="#743BAA" />

    <!-- Orange Star (Mid Left) -->
    <path d="M 170 420 Q 170 432, 158 432 Q 170 432, 170 444 Q 170 432, 182 432 Q 170 432, 170 420 Z" fill="#FEA711" opacity="0.8" />

    <!-- Purple Star (Lower Right) -->
    <path d="M 1220 620 Q 1220 634, 1206 634 Q 1220 634, 1220 648 Q 1220 634, 1234 634 Q 1220 634, 1220 620 Z" fill="#743BAA" opacity="0.85" />

    <!-- Tiny Accent Dots -->
    <circle cx="270" cy="150" r="4" fill="#743BAA" opacity="0.4" />
    <circle cx="1140" cy="260" r="5" fill="#FEA711" opacity="0.6" />
    <circle cx="480" cy="200" r="4.5" fill="#FEA711" opacity="0.5" />
    <circle cx="910" cy="180" r="4" fill="#743BAA" opacity="0.4" />
    <circle cx="210" cy="670" r="5" fill="#FEA711" opacity="0.5" />
    <circle cx="1200" cy="480" r="4" fill="#743BAA" opacity="0.5" />
  </g>
</svg>
